<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi - Praktikum Multimedia</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/bootstrap.js"></script>
</head>
<body>

<div class="container" style="margin-top: 40px;">
    <div class="row">
        <div class="col-sm-10 col-sm-offset-1">
           
            <form action="">
                <div class="form-group">
                    <label for="name">Nama:</label>
                    <input type="text" class="form-control" placeholder="Masukkan Nama" name="nama" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" placeholder="Masukkan Email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" placeholder="Masukkan Password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="jk">Jenis Kelamin:</label>
                    <select class="form-control" id="jk" name="jk">
                        <option>Pria</option>
                        <option>Wanita</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    <hr style="margin-top: 50px;">
    <footer class="text-center" style="padding-bottom: 30px; color: #555;">
        <p>Nama: Noveria Mumek | NIM: 240211060024</p>
        <p>&copy; 2026 Praktikum Sistem Multimedia</p>
    </footer>
</div>

</body>
</html>
